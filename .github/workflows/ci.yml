# CI (N02, N03, N08b): una prueba por regla en cada versión soportada, archivo dorado del ejemplo y
# prueba del artefacto (la rueda instalada en un entorno limpio). Plantilla común del portafolio.
# Un job «skipped» NO es verde: ningún job depende de otro ni se condiciona al evento.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: pruebas (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']   # requires-python >= 3.10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ci/requirements.txt
      - run: pip install -r ci/requirements.txt -e .
      - name: lint (ruff)
        run: ruff check .
      - name: tipos (mypy --strict)
        run: mypy
      # La cobertura se reporta (piso 95 %); la compuerta real es una prueba por regla: docs/reglas.md.
      - name: pruebas + cobertura
        run: pytest --junitxml=reporte.xml --cov --cov-report=xml --cov-report=term
      - name: probar que corrieron pruebas
        run: python3 herramientas/verificar_reportes.py pytest reporte.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pruebas-${{ matrix.python }}
          path: |
            reporte.xml
            coverage.xml

  paquete:
    name: paquete (rueda instalada en limpio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r ci/requirements.txt
      - name: construir la rueda
        run: python -m build --wheel --outdir dist .
      # Se prueba lo que se distribuye, no el árbol de fuentes: entorno limpio, sin el repo en el path.
      - name: instalar en un entorno limpio y correr el ejemplo
        run: |
          python -m venv /tmp/limpio
          /tmp/limpio/bin/pip install dist/*.whl
          cd /tmp
          /tmp/limpio/bin/python -c "import agentguard, importlib.resources as r; assert r.files('agentguard').joinpath('py.typed').is_file(); print('agentguard', agentguard.__version__)"
          /tmp/limpio/bin/python "$GITHUB_WORKSPACE/examples/llm_tool_call_guard.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rueda
          path: dist/*.whl
